openapi: 3.0.3
info:
  title: 'FacilityDesk API'
  description: "REST API v1 for FacilityDesk: work orders, technicians' jobs, sites, assets and dashboards."
  version: 1.0.0
servers:
  -
    url: 'http://facilitydesk.test'
tags:
  -
    name: Authentication
    description: 'Tokens are per device. Send them as `Authorization: Bearer <token>`.'
  -
    name: 'Work orders'
    description: ''
  -
    name: Technician
    description: ''
  -
    name: Sites
    description: ''
  -
    name: Assets
    description: ''
  -
    name: Dashboard
    description: ''
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Get a token from <code>POST /api/v1/auth/login</code>.'
security:
  -
    default: []
paths:
  /api/v1/auth/login:
    post:
      summary: 'Log in'
      operationId: logIn
      description: "Exchanges workspace, email and password for a bearer token. Limited to\n5 attempts a minute per IP. Wrong workspace, email or password all give\nthe same answer, so the endpoint cannot be used to discover accounts."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  token: 1|aBcD…
                  token_type: Bearer
                  expires_at: '2026-06-03T10:00:00+00:00'
                  user:
                    id: 7
                    name: 'Tom Tech'
                    email: tom@acme.test
                    phone: null
                    role: technician
                    client_id: null
                properties:
                  token:
                    type: string
                    example: 1|aBcD…
                  token_type:
                    type: string
                    example: Bearer
                  expires_at:
                    type: string
                    example: '2026-06-03T10:00:00+00:00'
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 7
                      name:
                        type: string
                        example: 'Tom Tech'
                      email:
                        type: string
                        example: tom@acme.test
                      phone:
                        type: string
                        example: null
                        nullable: true
                      role:
                        type: string
                        example: technician
                      client_id:
                        type: string
                        example: null
                        nullable: true
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'These credentials do not match our records.'
                  errors:
                    email:
                      - 'These credentials do not match our records.'
                properties:
                  message:
                    type: string
                    example: 'These credentials do not match our records.'
                  errors:
                    type: object
                    properties:
                      email:
                        type: array
                        example:
                          - 'These credentials do not match our records.'
                        items:
                          type: string
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tenant:
                  type: string
                  description: 'The workspace slug (the subdomain). Must not be greater than 60 characters.'
                  example: acme
                email:
                  type: string
                  description: 'Must be a valid email address.'
                  example: tech@acme.test
                password:
                  type: string
                  description: ''
                  example: password
                device_name:
                  type: string
                  description: "Shown in the user's list of signed-in devices. Must not be greater than 100 characters."
                  example: 'Pixel 8'
              required:
                - tenant
                - email
                - password
                - device_name
      security: []
  /api/v1/auth/logout:
    post:
      summary: 'Log out'
      operationId: logOut
      description: 'Revokes the token used for this request (other devices stay signed in).'
      parameters: []
      responses:
        204:
          description: ''
          content:
            application/json:
              schema:
                type: object
                nullable: true
      tags:
        - Authentication
  /api/v1/me:
    get:
      summary: 'Current user'
      operationId: currentUser
      description: 'The signed-in user, their workspace and permissions.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 7
                    name: 'Tom Tech'
                    email: tom@acme.test
                    phone: null
                    role: technician
                    client_id: null
                    tenant:
                      id: 1
                      name: 'Acme Facilities'
                      slug: acme
                      timezone: Asia/Kolkata
                    permissions:
                      - work_orders.work
                      - work_orders.internal_comments
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 7
                      name:
                        type: string
                        example: 'Tom Tech'
                      email:
                        type: string
                        example: tom@acme.test
                      phone:
                        type: string
                        example: null
                        nullable: true
                      role:
                        type: string
                        example: technician
                      client_id:
                        type: string
                        example: null
                        nullable: true
                      tenant:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          name:
                            type: string
                            example: 'Acme Facilities'
                          slug:
                            type: string
                            example: acme
                          timezone:
                            type: string
                            example: Asia/Kolkata
                      permissions:
                        type: array
                        example:
                          - work_orders.work
                          - work_orders.internal_comments
                        items:
                          type: string
      tags:
        - Authentication
  /api/v1/work-orders:
    get:
      summary: 'List work orders'
      operationId: listWorkOrders
      description: "Only what the caller may see: everything for supervisors and admins,\nassigned jobs for technicians, their client's work orders for client users."
      parameters:
        -
          in: query
          name: status
          description: 'One of open, assigned, in_progress, on_hold, resolved, closed, cancelled.'
          example: open
          required: false
          schema:
            type: string
            description: 'One of open, assigned, in_progress, on_hold, resolved, closed, cancelled.'
            example: open
            enum:
              - open
              - assigned
              - in_progress
              - on_hold
              - resolved
              - closed
              - cancelled
            nullable: true
        -
          in: query
          name: priority
          description: 'One of critical, high, medium, low.'
          example: high
          required: false
          schema:
            type: string
            description: 'One of critical, high, medium, low.'
            example: high
            enum:
              - critical
              - high
              - medium
              - low
            nullable: true
        -
          in: query
          name: site_id
          description: ''
          example: 1
          required: false
          schema:
            type: integer
            description: ''
            example: 1
            nullable: true
        -
          in: query
          name: assigned_to
          description: 'Technician user id.'
          example: 7
          required: false
          schema:
            type: integer
            description: 'Technician user id.'
            example: 7
            nullable: true
        -
          in: query
          name: from
          description: 'Raised on or after this date (tenant timezone). Must be a valid date in the format <code>Y-m-d</code>.'
          example: '2026-05-01'
          required: false
          schema:
            type: string
            description: 'Raised on or after this date (tenant timezone). Must be a valid date in the format <code>Y-m-d</code>.'
            example: '2026-05-01'
            nullable: true
        -
          in: query
          name: to
          description: 'Raised on or before this date (tenant timezone). Must be a valid date in the format <code>Y-m-d</code>. Must be a date after or equal to <code>from</code>.'
          example: '2026-05-31'
          required: false
          schema:
            type: string
            description: 'Raised on or before this date (tenant timezone). Must be a valid date in the format <code>Y-m-d</code>. Must be a date after or equal to <code>from</code>.'
            example: '2026-05-31'
            nullable: true
        -
          in: query
          name: per_page
          description: '1-100, default 20. Must be at least 1. Must not be greater than 100.'
          example: 20
          required: false
          schema:
            type: integer
            description: '1-100, default 20. Must be at least 1. Must not be greater than 100.'
            example: 20
            nullable: true
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
